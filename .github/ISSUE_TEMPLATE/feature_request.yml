name: Feature request
description: Suggest a new capability or a change to an existing package.
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which SolTechnology.Core package does this concern?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you would like, ideally with a short code sample.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.
