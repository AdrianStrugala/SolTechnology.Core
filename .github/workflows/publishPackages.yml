name: Build, test and publish

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.0.x'
    - name: Restore workload
      run: dotnet workload restore SolTechnology.Core.slnx
    - name: Restore dependencies
      run: dotnet restore SolTechnology.Core.slnx
    - name: Build
      run: dotnet build SolTechnology.Core.slnx --no-restore
    - name: Test
      shell: pwsh
      run: |
           .\.github\runTests.ps1

    - name: Guard - every packable src project is in the solution
      shell: bash
      run: |
        set -euo pipefail
        # Projects deliberately kept out of SolTechnology.Core.slnx while still packable-by-default.
        # Deprecated ids frozen for 1.0; step 07 sets <IsPackable>false>. Drop from this list once 07 lands.
        excluded="SolTechnology.Core.Scheduler SolTechnology.Core.Guards"
        slnx_projects="$(dotnet sln SolTechnology.Core.slnx list)"
        missing=0
        for csproj in src/*/*.csproj; do
          name="$(basename "$csproj" .csproj)"
          case " $excluded " in *" $name "*) continue ;; esac
          packable="$(dotnet msbuild "$csproj" -getProperty:IsPackable -nologo 2>/dev/null || echo true)"
          if [ "$(printf '%s' "$packable" | tr '[:upper:]' '[:lower:]')" = "false" ]; then
            continue
          fi
          # Match on the .csproj file name (case-insensitive): the Api folder is on disk as
          # 'SolTechnology.Core.Api' but recorded in .slnx as 'SolTechnology.Core.API'.
          if ! printf '%s\n' "$slnx_projects" | grep -qiF "/$name.csproj"; then
            echo "::error file=$csproj::Packable project '$name' is missing from SolTechnology.Core.slnx"
            missing=1
          fi
        done
        if [ "$missing" -ne 0 ]; then
          echo "Add the missing project(s) to SolTechnology.Core.slnx so the pack glob picks them up."
          exit 1
        fi

    - name: Guard - release tag matches the package version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        set -euo pipefail
        version="$(dotnet msbuild src/SolTechnology.Core/SolTechnology.Core.csproj -getProperty:Version -nologo)"
        if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match <Version>${version}</Version> in src/Directory.Build.props"
          exit 1
        fi

    - name: Pack every packable src project
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ./artifacts
        dotnet sln SolTechnology.Core.slnx list \
          | grep -E '^src/.+\.csproj$' \
          | while read -r csproj; do
              dotnet pack -c Release -o ./artifacts "$csproj"
            done

    - name: Upload packages
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages
        path: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
        if-no-files-found: error

  # Runs on every trigger and has no if:, so a red or skipped run also stops the tag publish.
  dreamtravel-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.0.x'
    - name: Restore workload
      run: dotnet workload restore SolTechnology.Core.slnx
    - name: Test DreamTravel
      shell: bash
      run: |
        set -uo pipefail
        # The component tests start SQL Server through Testcontainers on the runner's Docker.
        root=sample-tale-code-apps/DreamTravel/tests
        projects=(
          "$root/Unit/DreamTravel.Commands.UnitTests/DreamTravel.Commands.UnitTests.csproj"
          "$root/Unit/DreamTravel.Queries.UnitTests/DreamTravel.Queries.UnitTests.csproj"
          "$root/Unit/DreamTravel.TravelingSalesmanProblem.UnitTests/DreamTravel.TravelingSalesmanProblem.UnitTests.csproj"
          "$root/Unit/DreamTravel.Ui.UnitTests/DreamTravel.Ui.UnitTests.csproj"
          "$root/Unit/DreamTravel.GeolocationDataClients.IntegrationTests/DreamTravel.GeolocationDataClients.IntegrationTests.csproj"
          "$root/Component/DreamTravel.Component.Tests.csproj"
        )
        failed=()
        for project in "${projects[@]}"; do
          dotnet test "$project" || failed+=("$project")
        done
        if [ "${#failed[@]}" -ne 0 ]; then
          printf '::error::DreamTravel tests failed in %s\n' "${failed[@]}"
          exit 1
        fi
        echo "All ${#projects[@]} DreamTravel test projects passed."

  publish:
    needs: [build, dreamtravel-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download packages
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: nuget-packages
        path: ./artifacts
    - name: Setup .NET 10
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '10.0.x'
    # Pushing the .nupkg also pushes the matching .snupkg from the same folder.
    - name: Publish all nuget packages
      run: dotnet nuget push ./artifacts/*.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
