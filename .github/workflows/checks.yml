name: Convention and documentation checks

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0
    - name: Documentation - links, anchors, section citations, agent and skill indexes
      shell: pwsh
      run: ./.github/checkDocs.ps1
    - name: Conventions - C# lines added by the pull request
      if: github.event_name == 'pull_request'
      shell: pwsh
      env:
        BASE_REF: ${{ github.base_ref }}
      run: ./.github/checkConventions.ps1 -Base "origin/$env:BASE_REF"
